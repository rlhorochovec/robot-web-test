name: robot-web-test

on:
  push:
    branches: [ "develop", "main" ]

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3
      - name: Create folder for report
        run: mkdir report

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install additional dependencies if needed
          pip install -r requirements.txt

      - name: Run Robot Framework tests
        run: |
          if ! robot --outputdir report --exclude skip test/; then
              echo "Robot Framework tests failed. Rerunning failed tests..."
              if [ -f report/output.xml ]; then
                  robot --rerunfailed report/output.xml --outputdir report_rerun test/ || true
                  if [ -f report_rerun/output.xml ]; then
                      rebot --output report/output.xml --log report/log.html --report report/report.html --merge report/output.xml report_rerun/output.xml
                  else
                      echo "No output.xml file found from rerun. Skipping merge."
                  fi
              else
                  echo "No output.xml file found. Cannot rerun failed tests."
              fi
          fi

          echo "Script execution completed"
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: ./report
          name: report
          